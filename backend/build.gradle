plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ssafy'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.google.firebase:firebase-admin:9.4.3'
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // S3Presigner는 별도 아티팩트가 아니라 이 s3 모듈에 포함되어 있다.
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'io.rest-assured:rest-assured'

    // 커밋 3: (sender_id, client_message_id) partial unique index를
    // 실제 PostgreSQL 환경에서 검증하기 위한 Testcontainers 의존성(테스트 전용).
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'

    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'postgres', 'stt-kafka-e2e'
    }
    // production ENTRYPOINT와 동일하게 Asia/Seoul로 고정한다.
    // Docker build(UTC JVM)에서 TIMESTAMP WITHOUT TIME ZONE + Instant 비교가 깨지지 않게 한다.
    systemProperty 'user.timezone', 'Asia/Seoul'
}

// Docker(Testcontainers)가 필요한 PostgreSQL 전용 테스트만 실행하는 태스크다.
// 기본 test 태스크(Docker 빌드 기반 CI)에서는 제외하고, 로컬 Docker 환경에서만
// `./gradlew postgresTest`로 실행한다.
tasks.register('postgresTest', Test) {
    description = 'Runs PostgreSQL Testcontainers-based tests (requires local Docker).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'postgres'
    }
    systemProperty 'user.timezone', 'Asia/Seoul'
    // Testcontainers Docker 이미지 동시 빌드/Flyway lock 경합을 피한다.
    maxParallelForks = 1
    // Spring Boot + embedded Kafka postgres 스위트는 기본 512m에서 OOM이 난다.
    maxHeapSize = '2g'
    shouldRunAfter test
}

// 실제 로컬 Kafka와 FastAPI fake STT worker를 사용하는 선택형 왕복 테스트다.
// 실행 전 `docker compose ... up -d --build kafka redis ai`가 필요하다.
tasks.register('sttKafkaE2eTest', Test) {
    description = 'Runs Spring -> Kafka -> FastAPI -> Kafka STT round-trip test.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'stt-kafka-e2e'
    }
    shouldRunAfter test
}
