spring:
  config:
    activate:
      on-profile: local
    import:
      - optional:classpath:application-local-secret.yaml
      - optional:file:../infra/.env.local[.properties]
    # 작업 디렉터리가 backend/일 때만 로드된다. 저장소 루트에서 실행하면 무시됨(optional).

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ssabangpalbang}
    username: ${POSTGRES_USER:ssabang}
    password: ${POSTGRES_PASSWORD:ssabang_local_password}
    driver-class-name: org.postgresql.Driver

    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: none

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:ssabang_local_password}
      timeout: 2s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    admin:
      fail-fast: true

    producer:
      acks: all

    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ssafy.ssabangpalbang: DEBUG

public-data:
  service-key: ${PUBLIC_DATA_SERVICE_KEY:}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}

dataload:
  sigungu-codes: []
  deal-year-months: []
  request-delay-ms: 120
  dry-run: false

sbpb:
  schedule-reminder:
    enabled: true
    cron: "0 */10 * * * *"
    lead-time-hours: 24
