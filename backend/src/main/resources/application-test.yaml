spring:
  config:
    activate:
      on-profile: test

  flyway:
    enabled: false

  datasource:
    url: jdbc:h2:mem:ssabangpalbang;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: none

    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Seoul

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 1s

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: 0

management:
  health:
    redis:
      enabled: false

logging:
  level:
    root: WARN
    com.ssafy.ssabangpalbang: INFO

aws:
  s3:
    enabled: true
    bucket: test-bucket
    region: ap-northeast-2
    presigned-get-ttl: 10m

sbpb:
  schedule-reminder:
    enabled: false

ssabangpalbang:
  report:
    rag:
      enabled: false
  chatbot:
    recovery:
      enabled: false
