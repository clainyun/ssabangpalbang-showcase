name: ssabangpalbang-prod

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: ssabangpalbang-postgres:17-vector-postgis
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul

    volumes:
      - postgres-prod-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

    networks:
      - ssabang-prod-network

  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"

    volumes:
      - redis-prod-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - ssabang-prod-network

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >-
        CONTROLLER://:29093,
        INTERNAL://:19092

      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:19092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        INTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      CLUSTER_ID: ${KAFKA_CLUSTER_ID}

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka-prod-data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - ssabang-prod-network

  # INF-007 Phase 2: create-if-not-exists for REPORT request + DLT topics.
  # Does not change STT topics, Backend NewTopic beans, or postgres.
  kafka-report-topic-init:
    image: apache/kafka:4.3.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      REPORT_KAFKA_TOPIC: ${REPORT_KAFKA_TOPIC:-field-visit.report.request.v1}
      REPORT_KAFKA_DLT_TOPIC: ${REPORT_KAFKA_DLT_TOPIC:-field-visit.report.request.dlq.v1}
      REPORT_KAFKA_PARTITIONS: ${REPORT_KAFKA_PARTITIONS:-1}
      REPORT_KAFKA_RETENTION_MS: ${REPORT_KAFKA_RETENTION_MS:-604800000}
      REPORT_KAFKA_DLT_RETENTION_MS: ${REPORT_KAFKA_DLT_RETENTION_MS:-604800000}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        BOOT=kafka:19092
        create_topic() {
          local topic="$$1"
          local retention="$$2"
          if /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOT" --list | grep -Fxq "$$topic"; then
            echo "topic exists: $$topic"
          else
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOT" \
              --create --topic "$$topic" \
              --partitions "$${REPORT_KAFKA_PARTITIONS}" \
              --replication-factor 1 \
              --config "cleanup.policy=delete" \
              --config "retention.ms=$${retention}"
            echo "topic created: $$topic"
          fi
        }
        create_topic "$${REPORT_KAFKA_TOPIC}" "$${REPORT_KAFKA_RETENTION_MS}"
        create_topic "$${REPORT_KAFKA_DLT_TOPIC}" "$${REPORT_KAFKA_DLT_RETENTION_MS}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - ssabang-prod-network

  app:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-ssabangpalbang-backend:prod}
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      APARTMENT_IMAGE_PUBLIC_BASE_URL: ${APARTMENT_IMAGE_PUBLIC_BASE_URL:-}
      MEDIA_GATEWAY_ENABLED: ${MEDIA_GATEWAY_ENABLED:-true}
      MEDIA_GATEWAY_BASE_URL: ${MEDIA_GATEWAY_BASE_URL}
      MEDIA_GATEWAY_INTERNAL_TOKEN: ${MEDIA_GATEWAY_INTERNAL_TOKEN}
      MEDIA_GATEWAY_CONNECT_TIMEOUT: ${MEDIA_GATEWAY_CONNECT_TIMEOUT:-3s}
      MEDIA_GATEWAY_READ_TIMEOUT: ${MEDIA_GATEWAY_READ_TIMEOUT:-10s}
      MEDIA_STT_RETENTION: ${MEDIA_STT_RETENTION:-24h}
      CHATBOT_AI_BASE_URL: ${CHATBOT_AI_BASE_URL:-http://ai:8000}
      CHATBOT_AI_READ_TIMEOUT: ${CHATBOT_AI_READ_TIMEOUT:-60s}

      # 비밀번호 재설정 코드 발송용 SMTP(BE-002). application-prod.yaml 의 spring.mail 로 주입된다.
      # 값이 채워져야 실제 발송(SmtpEmailSender). 실제 host/username/password 는 코드가 아니라
      # infra/.env.prod 에 주입(비밀). ⚠️ 배포 전 .env.prod 값을 먼저 채울 것.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

      # AI-002 체크리스트 생성 FastAPI 주소. 미지정 시 기본값 localhost:8000(백엔드 컨테이너 자신)을
      # 가리켜 연결 실패 → fallback 체크리스트로 떨어지므로, 챗봇과 동일하게 ai 서비스로 지정한다.
      FIELD_VISIT_AI_BASE_URL: ${FIELD_VISIT_AI_BASE_URL:-http://ai:8000}
      CHECKLIST_CATALOG_SELECTION_ENABLED: ${CHECKLIST_CATALOG_SELECTION_ENABLED:-true}
      CHECKLIST_CATALOG_TARGET_ITEM_COUNT: ${CHECKLIST_CATALOG_TARGET_ITEM_COUNT:-25}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # AI-007 Consumer 배포와 Producer→Consumer E2E 준비 후 별도 승인으로만 true.
      REPORT_KAFKA_ENABLED: ${REPORT_KAFKA_ENABLED:-false}
      REPORT_KAFKA_TOPIC: ${REPORT_KAFKA_TOPIC:-field-visit.report.request.v1}
      REPORT_KAFKA_PARTITIONS: ${REPORT_KAFKA_PARTITIONS:-1}
      REPORT_KAFKA_REPLICATION_FACTOR: ${REPORT_KAFKA_REPLICATION_FACTOR:-1}
      REPORT_KAFKA_RETENTION_MS: ${REPORT_KAFKA_RETENTION_MS:-604800000}
      REPORT_KAFKA_PUBLISH_TIMEOUT: ${REPORT_KAFKA_PUBLISH_TIMEOUT:-10s}
      REPORT_INTERNAL_TOKEN: ${REPORT_INTERNAL_TOKEN:-}
      REPORT_PROCESSING_LEASE_DURATION: ${REPORT_PROCESSING_LEASE_DURATION:-30m}
      STT_KAFKA_ENABLED: ${STT_KAFKA_ENABLED:-true}
      STT_KAFKA_REQUEST_TOPIC: ${STT_KAFKA_REQUEST_TOPIC:-field-visit.stt.request.v1}
      STT_KAFKA_RESULT_TOPIC: ${STT_KAFKA_RESULT_TOPIC:-field-visit.stt.result.v1}
      STT_KAFKA_REQUEST_DLQ_TOPIC: ${STT_KAFKA_DLQ_TOPIC:-field-visit.stt.request.dlq.v1}
      STT_KAFKA_RESULT_DLT_TOPIC: ${STT_KAFKA_RESULT_DLT_TOPIC:-field-visit.stt.result.dlt.v1}
      STT_KAFKA_BACKEND_CONSUMER_GROUP: ${STT_KAFKA_BACKEND_CONSUMER_GROUP:-ssabangpalbang-backend-stt-v1}
      STT_KAFKA_PUBLISH_TIMEOUT: ${STT_KAFKA_PUBLISH_TIMEOUT:-10s}
      STT_KAFKA_RESULT_RETRY_BACKOFF: ${STT_KAFKA_RESULT_RETRY_BACKOFF:-1s}
      STT_KAFKA_RESULT_MAX_RETRIES: ${STT_KAFKA_RESULT_MAX_RETRIES:-2}
      STT_RELIABILITY_ENABLED: ${STT_RELIABILITY_ENABLED:-true}
      STT_PENDING_TIMEOUT: ${STT_PENDING_TIMEOUT:-5m}
      STT_PROCESSING_TIMEOUT: ${STT_PROCESSING_TIMEOUT:-15m}

      FCM_ENABLED: ${FCM_ENABLED:-false}
      FCM_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
      TZ: Asia/Seoul

    secrets:
      - source: firebase-service-account
        target: firebase-service-account.json

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

    stop_grace_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - ssabang-prod-network

  ai:
    build:
      context: ../ai
      dockerfile: Dockerfile
    image: ssabangpalbang-ai:prod
    restart: unless-stopped

    environment:
      AI_PROVIDER: ${AI_PROVIDER:-gms-gemini}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      CHATBOT_AI_PROVIDER: ${CHATBOT_AI_PROVIDER:-}
      CHATBOT_AI_API_BASE_URL: ${CHATBOT_AI_API_BASE_URL:-}
      CHATBOT_AI_API_KEY: ${CHATBOT_AI_API_KEY:-}
      CHATBOT_AI_MODEL: ${CHATBOT_AI_MODEL:-}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-}
      AI_JSON_RETRY_COUNT: ${AI_JSON_RETRY_COUNT:-2}
      AI_STRUCTURED_OUTPUT: ${AI_STRUCTURED_OUTPUT:-true}
      GMS_KEY: ${GMS_KEY:-}
      GMS_GEMINI_ENDPOINT_URL: ${GMS_GEMINI_ENDPOINT_URL:-https://ai-gateway.example.com/gmsapi/generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent}
      GMS_GEMINI_MODEL: ${GMS_GEMINI_MODEL:-gemini-3.5-flash}
      GMS_OPENAI_ENDPOINT_URL: ${GMS_OPENAI_ENDPOINT_URL:-}
      GMS_OPENAI_MODEL: ${GMS_OPENAI_MODEL:-gpt-5.4-mini}
      GMS_ANTHROPIC_ENDPOINT_URL: ${GMS_ANTHROPIC_ENDPOINT_URL:-}
      GMS_ANTHROPIC_MODEL: ${GMS_ANTHROPIC_MODEL:-claude-sonnet-4-6}
      GMS_ANTHROPIC_VERSION: ${GMS_ANTHROPIC_VERSION:-2023-06-01}
      GMS_ANTHROPIC_MAX_TOKENS: ${GMS_ANTHROPIC_MAX_TOKENS:-4096}
      REPORT_INTERNAL_TOKEN: ${REPORT_INTERNAL_TOKEN:-}
      # INF-007 Phase 2 Report Worker (default disabled; policy default block).
      # Do not enable in production without separate approval.
      REPORT_WORKER_ENABLED: ${REPORT_WORKER_ENABLED:-false}
      REPORT_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REPORT_KAFKA_TOPIC: ${REPORT_KAFKA_TOPIC:-field-visit.report.request.v1}
      REPORT_KAFKA_GROUP_ID: ${REPORT_KAFKA_GROUP_ID:-ai.report-worker.v1}
      REPORT_KAFKA_DLT_TOPIC: ${REPORT_KAFKA_DLT_TOPIC:-field-visit.report.request.dlq.v1}
      REPORT_KAFKA_REJECTION_POLICY: ${REPORT_KAFKA_REJECTION_POLICY:-block}
      REPORT_KAFKA_DLT_RETENTION_MS: ${REPORT_KAFKA_DLT_RETENTION_MS:-604800000}
      REPORT_KAFKA_AUTO_OFFSET_RESET: ${REPORT_KAFKA_AUTO_OFFSET_RESET:-earliest}
      REPORT_KAFKA_MAX_POLL_INTERVAL_MS: ${REPORT_KAFKA_MAX_POLL_INTERVAL_MS:-1800000}
      REPORT_RETRY_BACKOFF_SECONDS: ${REPORT_RETRY_BACKOFF_SECONDS:-2}
      REPORT_BACKEND_BASE_URL: ${REPORT_BACKEND_BASE_URL:-http://app:8080}
      REPORT_BACKEND_TIMEOUT_SECONDS: ${REPORT_BACKEND_TIMEOUT_SECONDS:-15}
      AI_REPORT_DB_ENABLED: ${AI_REPORT_DB_ENABLED:-false}
      AI_REPORT_DB_HOST: postgres
      AI_REPORT_DB_PORT: 5432
      AI_REPORT_DB_NAME: ${POSTGRES_DB}
      AI_REPORT_DB_USER: ${AI_REPORT_DB_USER:-}
      AI_REPORT_DB_PASSWORD: ${AI_REPORT_DB_PASSWORD:-}
      AI_REPORT_DB_CONNECT_TIMEOUT_SECONDS: ${AI_REPORT_DB_CONNECT_TIMEOUT_SECONDS:-5}
      AI_REPORT_DB_STATEMENT_TIMEOUT_MS: ${AI_REPORT_DB_STATEMENT_TIMEOUT_MS:-5000}
      # AI-008 RAG 색인 · 검색 (DB 계정은 AI_REPORT_DB_* 를 재사용한다)
      RAG_ENABLED: ${RAG_ENABLED:-false}
      RAG_DB_HOST: postgres
      RAG_DB_PORT: 5432
      RAG_DB_NAME: ${POSTGRES_DB}
      RAG_DB_USER: ${AI_REPORT_DB_USER:-}
      RAG_DB_PASSWORD: ${AI_REPORT_DB_PASSWORD:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-dragonkue/multilingual-e5-small-ko-v2}
      RAG_EMBEDDING_DEVICE: ${RAG_EMBEDDING_DEVICE:-cpu}
      RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-16}
      # AI-009 챗봇 답변
      CHATBOT_TOP_K: ${CHATBOT_TOP_K:-60}
      CHATBOT_MAX_CONTEXT_CHARS: ${CHATBOT_MAX_CONTEXT_CHARS:-30000}
      CHATBOT_SEARCH_REWRITE_ENABLED: ${CHATBOT_SEARCH_REWRITE_ENABLED:-true}
      CHATBOT_WEB_RESULT_FILTER_ENABLED: ${CHATBOT_WEB_RESULT_FILTER_ENABLED:-true}
      CHATBOT_LAZY_WEB_ENABLED: ${CHATBOT_LAZY_WEB_ENABLED:-true}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-none}
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
      WEB_SEARCH_BASE_URL: ${WEB_SEARCH_BASE_URL:-}
      WEB_SEARCH_TOP_K: ${WEB_SEARCH_TOP_K:-5}
      WEB_SEARCH_TIMEOUT_SECONDS: ${WEB_SEARCH_TIMEOUT_SECONDS:-10}
      WEB_SEARCH_COLLECTIONS: ${WEB_SEARCH_COLLECTIONS:-web,blog}
      WEB_SEARCH_MAX_AGE_DAYS: ${WEB_SEARCH_MAX_AGE_DAYS:-1095}
      STT_ENABLED: ${STT_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      STT_KAFKA_REQUEST_TOPIC: ${STT_KAFKA_REQUEST_TOPIC:-field-visit.stt.request.v1}
      STT_KAFKA_RESULT_TOPIC: ${STT_KAFKA_RESULT_TOPIC:-field-visit.stt.result.v1}
      STT_KAFKA_DLQ_TOPIC: ${STT_KAFKA_DLQ_TOPIC:-field-visit.stt.request.dlq.v1}
      STT_KAFKA_CONSUMER_GROUP: ${STT_KAFKA_CONSUMER_GROUP:-ssabangpalbang-ai-stt-v1}
      STT_KAFKA_CLIENT_ID: ${STT_KAFKA_CLIENT_ID:-ssabangpalbang-ai-stt}
      STT_KAFKA_MAX_POLL_INTERVAL_MS: ${STT_KAFKA_MAX_POLL_INTERVAL_MS:-900000}
      STT_PROVIDER: ${STT_PROVIDER:-openai}
      STT_MODEL: ${STT_MODEL:-whisper-1}
      STT_OPENAI_API_KEY: ${STT_OPENAI_API_KEY:-}
      STT_OPENAI_BASE_URL: ${STT_OPENAI_BASE_URL:-https://api.openai.com/v1}
      STT_OPENAI_TIMEOUT_SECONDS: ${STT_OPENAI_TIMEOUT_SECONDS:-120}
      STT_DEVICE: ${STT_DEVICE:-cpu}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      STT_MODEL_CACHE_DIR: /models
      STT_MAX_CONCURRENCY: ${STT_MAX_CONCURRENCY:-1}
      STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-600}
      STT_WARMUP_TIMEOUT_SECONDS: ${STT_WARMUP_TIMEOUT_SECONDS:-300}
      AUDIO_STORE_PROVIDER: ${AUDIO_STORE_PROVIDER:-media-gateway}
      MEDIA_GATEWAY_BASE_URL: ${MEDIA_GATEWAY_BASE_URL}
      MEDIA_GATEWAY_INTERNAL_TOKEN: ${MEDIA_GATEWAY_INTERNAL_TOKEN}
      MEDIA_GATEWAY_TIMEOUT_SECONDS: ${MEDIA_GATEWAY_TIMEOUT_SECONDS:-15}
      MEDIA_DOWNLOAD_TIMEOUT_SECONDS: ${MEDIA_DOWNLOAD_TIMEOUT_SECONDS:-120}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      STT_REDIS_KEY_PREFIX: ${STT_REDIS_KEY_PREFIX:-stt:attempt}
      STT_REDIS_LEASE_SECONDS: ${STT_REDIS_LEASE_SECONDS:-900}
      STT_REDIS_RESULT_TTL_SECONDS: ${STT_REDIS_RESULT_TTL_SECONDS:-604800}
      TZ: Asia/Seoul

    volumes:
      - ai-model-cache:/models

    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

    # Must be >= ReportKafkaWorker shutdown_grace_seconds (default 30s).
    stop_grace_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - ssabang-prod-network

volumes:
  postgres-prod-data:
  redis-prod-data:
  kafka-prod-data:
  ai-model-cache:

secrets:
  firebase-service-account:
    environment: FCM_SERVICE_ACCOUNT_JSON

networks:
  ssabang-prod-network:
    driver: bridge
