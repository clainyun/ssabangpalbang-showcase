server {
    listen 80;
    listen [::]:80;
    server_name portfolio.example.com;

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/ssabangpalbang-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Retry-After 300 always;
        return 503;
    }
}
