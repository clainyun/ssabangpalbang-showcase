map $http_upgrade $ssabang_connection_upgrade {
    default upgrade;
    ''      close;
}

log_format ssabang_safe
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_user_agent" request_time=$request_time';

upstream ssabangpalbang_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name portfolio.example.com;

    server_tokens off;
    access_log /var/log/nginx/ssabangpalbang-access.log ssabang_safe;
    error_log /var/log/nginx/ssabangpalbang-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://portfolio.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portfolio.example.com;

    server_tokens off;
    access_log /var/log/nginx/ssabangpalbang-access.log ssabang_safe;
    error_log /var/log/nginx/ssabangpalbang-error.log warn;

    ssl_certificate
        /etc/letsencrypt/live/portfolio.example.com/fullchain.pem;
    ssl_certificate_key
        /etc/letsencrypt/live/portfolio.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSABANG_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location = /.well-known/assetlinks.json {
        root /var/www/ssabangpalbang/app-link-assets/current;
        try_files $uri =404;
        default_type application/json;
        access_log off;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
        limit_except GET HEAD {
            deny all;
        }
    }

    location = /share/report-card.png {
        root /var/www/ssabangpalbang/app-link-assets/current;
        try_files $uri =404;
        default_type image/png;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff";
        limit_except GET HEAD {
            deny all;
        }
    }

    location = /share/report.webmanifest {
        root /var/www/ssabangpalbang/app-link-assets/current;
        try_files $uri =404;
        default_type application/manifest+json;
        access_log off;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
        limit_except GET HEAD {
            deny all;
        }
    }

    location = /share/report-open.js {
        root /var/www/ssabangpalbang/app-link-assets/current;
        try_files $uri =404;
        default_type application/javascript;
        access_log off;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
        limit_except GET HEAD {
            deny all;
        }
    }

    location ~ ^/open/report/(?<report_id>[1-9][0-9]*)$ {
        if ($request_uri !~ "^/open/report/(?:[1-9]|[1-9][0-9]{1,14}|[1-8][0-9]{15}|900[0-6][0-9]{12}|90070[0-9]{11}|90071[0-8][0-9]{10}|900719[0-8][0-9]{9}|9007199[01][0-9]{8}|90071992[0-4][0-9]{7}|900719925[0-3][0-9]{6}|9007199254[0-6][0-9]{5}|90071992547[0-3][0-9]{4}|9007199254740[0-8][0-9]{2}|90071992547409[0-8][0-9]|900719925474099[01])(?:\?.*)?$") {
            return 404;
        }

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        add_header Cache-Control "no-store";
        return 302 https://portfolio.example.com/report/$report_id?install=1;
    }

    location ~ ^/report/(?<report_id>[1-9][0-9]*)$ {
        if ($request_uri !~ "^/report/(?:[1-9]|[1-9][0-9]{1,14}|[1-8][0-9]{15}|900[0-6][0-9]{12}|90070[0-9]{11}|90071[0-8][0-9]{10}|900719[0-8][0-9]{9}|9007199[01][0-9]{8}|90071992[0-4][0-9]{7}|900719925[0-3][0-9]{6}|9007199254[0-6][0-9]{5}|90071992547[0-3][0-9]{4}|9007199254740[0-8][0-9]{2}|90071992547409[0-8][0-9]|900719925474099[01])(?:\?.*)?$") {
            return 404;
        }

        root /var/www/ssabangpalbang/app-link-assets/current;
        try_files /share/report.html =404;
        default_type text/html;
        charset utf-8;
        sub_filter '__REPORT_URL__' 'https://portfolio.example.com/report/$report_id';
        sub_filter '__REPORT_OPEN_URL__' 'https://portfolio.example.com/open/report/$report_id';
        sub_filter '__REPORT_ID__' '$report_id';
        sub_filter_once off;
        add_header Cache-Control "public, max-age=300";
        add_header Content-Security-Policy "default-src 'none'; img-src https://portfolio.example.com; manifest-src 'self'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
        add_header Referrer-Policy "no-referrer";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header X-Robots-Tag "noindex, nofollow, noarchive";
        limit_except GET HEAD {
            deny all;
        }
    }

    location /api/ {
        proxy_pass http://ssabangpalbang_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location ~ ^/oauth/(kakao|naver)/callback$ {
        proxy_pass http://ssabangpalbang_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ^~ /apartment-images/ {
        root /var/www/ssabangpalbang;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        limit_except GET HEAD {
            deny all;
        }
    }

    location = /actuator/health {
        proxy_pass http://ssabangpalbang_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_no_cache 1;
    }

    location = /ws {
        proxy_pass http://ssabangpalbang_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ssabang_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
