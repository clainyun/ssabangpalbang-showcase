# Isolated Backend + PostgreSQL + Redis + Kafka for INF-007 Phase 2 opt-in E2E.
# Never reuse production project names, volumes, or host ports 5432/8080/9092.
# Usage (from repo root, after building backend jar):
#   docker compose -p inf007-report-backend-e2e-<suffix> \
#     -f infra/docker-compose.report-backend-e2e.yml \
#     --env-file <generated-e2e.env> up -d --wait
name: inf007-report-backend-e2e

services:
  postgres-e2e:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${REPORT_BACKEND_E2E_DB_NAME}
      POSTGRES_USER: ${REPORT_BACKEND_E2E_DB_USER:-inf007_e2e}
      POSTGRES_PASSWORD: ${REPORT_BACKEND_E2E_DB_PASSWORD:-inf007_e2e_password_only}
    ports:
      - "127.0.0.1:${REPORT_BACKEND_E2E_DB_PORT}:5432"
    volumes:
      - postgres-e2e-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - report-backend-e2e-network

  redis-e2e:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REPORT_BACKEND_E2E_REDIS_PASSWORD:-inf007_e2e_redis_only}
    command:
      [
        "redis-server",
        "--requirepass",
        "${REPORT_BACKEND_E2E_REDIS_PASSWORD:-inf007_e2e_redis_only}",
        "--appendonly",
        "no"
      ]
    ports:
      - "127.0.0.1:${REPORT_BACKEND_E2E_REDIS_PORT}:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - report-backend-e2e-network

  kafka-e2e:
    image: apache/kafka:4.3.1
    hostname: kafka-e2e
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-e2e:19092,EXTERNAL://127.0.0.1:${REPORT_BACKEND_E2E_KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-e2e:29093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:${REPORT_BACKEND_E2E_KAFKA_PORT}:9092"
    volumes:
      - kafka-e2e-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-e2e:19092 --list >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - report-backend-e2e-network

  backend-e2e:
    image: eclipse-temurin:17-jre-jammy
    working_dir: /app
    volumes:
      - ${REPORT_BACKEND_E2E_JAR_HOST_PATH}:/app/app.jar:ro
    command:
      [
        "java",
        "-Duser.timezone=Asia/Seoul",
        "-jar",
        "/app/app.jar"
      ]
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      JWT_SECRET: ${REPORT_BACKEND_E2E_JWT_SECRET}
      POSTGRES_HOST: postgres-e2e
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${REPORT_BACKEND_E2E_DB_NAME}
      POSTGRES_USER: ${REPORT_BACKEND_E2E_DB_USER:-inf007_e2e}
      POSTGRES_PASSWORD: ${REPORT_BACKEND_E2E_DB_PASSWORD:-inf007_e2e_password_only}
      REDIS_HOST: redis-e2e
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REPORT_BACKEND_E2E_REDIS_PASSWORD:-inf007_e2e_redis_only}
      KAFKA_BOOTSTRAP_SERVERS: kafka-e2e:19092
      REPORT_INTERNAL_TOKEN: ${REPORT_BACKEND_E2E_INTERNAL_TOKEN}
      REPORT_PROCESSING_LEASE_DURATION: 30m
      REPORT_KAFKA_ENABLED: "false"
      STT_KAFKA_ENABLED: "false"
      STT_RELIABILITY_ENABLED: "false"
      MEDIA_GATEWAY_ENABLED: "false"
      FCM_ENABLED: "false"
      CHATBOT_ANSWER_RECOVERY_ENABLED: "false"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${REPORT_BACKEND_E2E_BACKEND_PORT}:8080"
    depends_on:
      postgres-e2e:
        condition: service_healthy
      redis-e2e:
        condition: service_healthy
      kafka-e2e:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 40s
    networks:
      - report-backend-e2e-network

volumes:
  postgres-e2e-data:
    name: ${REPORT_BACKEND_E2E_PG_VOLUME}
  kafka-e2e-data:
    name: ${REPORT_BACKEND_E2E_KAFKA_VOLUME}

networks:
  report-backend-e2e-network:
    driver: bridge
